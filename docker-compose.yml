services:
  db:
    image: postgres:16-alpine
    container_name: appointmentguard_db
    restart: always
    environment:
      POSTGRES_DB: appointmentguard_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment_user -d appointmentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: appointmentguard_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-appointmentguard-dev-secret-key
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DATABASE_URL=postgres://appointment_user:appointment_pass@db:5432/appointmentguard_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
