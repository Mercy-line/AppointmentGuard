services:
  - type: web
    name: appointmentguard-api
    env: docker
    plan: free
    branch: production
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: appointmentguard-db
          property: connectionString

databases:
  - name: appointmentguard-db
    databaseName: appointmentguard_db
    user: appointment_user
    plan: free
