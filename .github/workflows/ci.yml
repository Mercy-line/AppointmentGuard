name: AppointmentGuard CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Run Flake8 & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appointmentguard_test_db
          POSTGRES_USER: appointment_user
          POSTGRES_PASSWORD: appointment_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --exclude=.git,__pycache__,venv,.venv,build,dist,frontend,node_modules --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exclude=.git,__pycache__,venv,.venv,build,dist,frontend,node_modules --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Suite
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-testing-secret-key-12345' }}
          DEBUG: 'False'
          DATABASE_URL: postgres://appointment_user:appointment_pass@127.0.0.1:5432/appointmentguard_test_db
        run: |
          pytest --tb=short
