name: AppointmentGuard CD Deployment Pipeline

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    name: Build Docker Container & Trigger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pre-Deployment Test Checks
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-testing-secret-key-12345' }}
          DEBUG: 'False'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest --tb=short

      - name: Build & Test Non-Root Docker Image
        run: |
          docker build -t appointmentguard:latest .
          # Verify container user is non-root appuser (UID 10001)
          CONTAINER_USER=$(docker run --rm appointmentguard:latest id -u)
          echo "Verified Container execution UID: $CONTAINER_USER"
          if [ "$CONTAINER_USER" != "10001" ]; then
            echo "Error: Container must run as non-root user (UID 10001)"
            exit 1
          fi

      - name: Trigger Cloud Platform Deployment Webhook
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_HOOK_URL"
